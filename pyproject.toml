[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-powerbi-agent"
version = "0.1.0"
description = "AI data analyst and Power BI semantic model / report generation agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "ai-powerbi-agent contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "polars>=1.0",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
]

[project.scripts]
powerbi-agent = "powerbi_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests across multiple components",
    "powerbi: tests that need a real Power BI / Fabric tenant (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S", "PTH"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["powerbi_agent"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "polars.*", "pyarrow.*", "openpyxl.*"]
ignore_missing_imports = true
